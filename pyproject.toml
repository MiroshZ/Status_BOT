[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "status-bot"
version = "0.1.0"
description = "Telegram AI bot for AO Status registrar company"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.7,<4",
    "openai>=1.70,<2",
    "pydantic-settings>=2.2,<3",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
status-bot = "status_bot.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
